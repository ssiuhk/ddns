# Docker publishes the port on the host for IPv4 and IPv6, so IPv4 is enough here
local-address=0.0.0.0
include-dir=/etc/powerdns/pdns.d

# Records are served by the ddns remote backend, configured in ddns.j2
launch=remote

# Hosts change their address at any time, so cache only for the record TTL
cache-ttl=0
query-cache-ttl=5
negquery-cache-ttl=5

disable-axfr=yes
version-string=anonymous
loglevel=4
