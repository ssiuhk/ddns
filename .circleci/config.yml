version: 2.1
orbs:
  docker: circleci/docker@1.5.0
jobs:
  test:
    docker:
      - image: cimg/go:1.26
    steps:
      - checkout
      - run: go mod download
      - run: go vet ./...
      - run: go test -v ./...

  docker-build:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - checkout
      - docker/build:
          image: pboehm/ddns
          dockerfile: docker/ddns/Dockerfile

  docker-build-and-push:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - checkout
      - docker/check
      - docker/build:
          image: pboehm/ddns
          dockerfile: docker/ddns/Dockerfile
          tag: $CIRCLE_SHA1,latest
      - docker/push:
          image: pboehm/ddns
          tag: $CIRCLE_SHA1,latest

workflows:
  commit:
    jobs:
      - test:
          filters:  # required since `docker-XXXX` have tag filters AND require `test`
            tags:
              only: /.*/

      - docker-build:
          requires:
            - test
          filters:
            branches:
              ignore: master

      - docker-build-and-push:
          requires:
            - test
          filters:
            branches:
              only: master